[package]
name = "bezel-client"
version = "0.1.0"
edition = "2021"
description = "Dials a bezel over Iroh: HTTP/1.1 per QUIC bi-stream, capability in hand."

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
iroh = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
bezel = { path = "../bezel" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
uuid = { version = "1", features = ["v4"] }
