[package]
name = "erisdb-client"
version = "0.1.0"
edition = "2021"
description = "Dials an ErisDB over Iroh as an app its mesh let in: HTTP/1.1 per QUIC bi-stream, the key its credential."
license = "MIT"
repository = "https://github.com/Eriskii/ErisDB"
readme = "README.md"
keywords = ["erisdb", "iroh", "quic", "client", "jni"]
categories = ["api-bindings", "network-programming"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1"
erisoverlaynetwork = { git = "https://github.com/Eriskii/ErisOverlayNetwork", tag = "v0.2.0" }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
iroh = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# The suite drives the real erisdb binary, built from ../erisdb on demand,
# against Postgres in a container. Nothing here links the erisdb crate.
[dev-dependencies]
hyper = { version = "1", features = ["client", "server", "http1"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
