[package]
name = "erisdb"
version = "0.1.0"
edition = "2021"
description = "Holds your facets."

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
iroh = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# No default features: they pull in `resolve-http` and `resolve-file`, which
# make a `$ref` in a stored schema fetch a URL or read a local file every time
# a body is validated. Facet schemas are caller-supplied data, so that reach is
# a hole, not a feature. Local `$ref` still resolves; `guard_schema` refuses
# the rest at registration.
jsonschema = { version = "0.49", default-features = false }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14.1", default-features = false }
png = "0.18.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
anyhow = "1"
rqrr = "0.10.1"

[[bin]]
name = "erisdb"
path = "src/bin/erisdb.rs"
