[package]
name = "erisdb-web"
version = "0.1.0"
edition = "2024"
description = "ErisDB for browser apps: sign in by an ErisOverlayNetwork ticket and call ErisDB over Iroh, through a relay, as the app's own key."
license = "MIT"
repository = "https://github.com/Eriskii/ErisDB"
readme = "README.md"
keywords = ["erisdb", "iroh", "wasm", "browser", "client"]
categories = ["wasm", "api-bindings", "network-programming"]

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
erisoverlaynetwork = { git = "https://github.com/Eriskii/ErisOverlayNetwork", tag = "v0.3.0", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
js-sys = "0.3"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
