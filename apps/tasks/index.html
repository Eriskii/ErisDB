<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bezel · tasks</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --muted: #8a8578;
    --line: #e5e2da; --accent: #7a5af5; --danger: #c94f3d; --ok: #3d8b5f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --card: #201f24; --ink: #e8e6e1; --muted: #918c80;
      --line: #2e2d33; --accent: #9d85ff; --danger: #e07a68; --ok: #6cbf92;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, sans-serif;
    display: flex; justify-content: center; padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 34rem; }
  h1 { font-size: 1.1rem; letter-spacing: .04em; display: flex; align-items: baseline; gap: .5rem; }
  h1 .status { font-size: .75rem; color: var(--muted); font-weight: normal; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  form.add { display: flex; gap: .5rem; flex-wrap: wrap; }
  input, button {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #title { flex: 1 1 12rem; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.task {
    display: flex; align-items: center; gap: .7rem;
    padding: .55rem .2rem; border-bottom: 1px solid var(--line);
  }
  li.task:last-child { border-bottom: none; }
  li.task .t { flex: 1; }
  li.task.done .t { text-decoration: line-through; color: var(--muted); }
  .due { font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .due.overdue { color: var(--danger); font-weight: 600; }
  .x { border: none; background: none; color: var(--muted); font-size: 1rem; }
  .x:hover { color: var(--danger); }
  details.settings summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  details.settings .row { display: flex; flex-direction: column; gap: .5rem; margin-top: .7rem; }
  .empty { color: var(--muted); text-align: center; padding: 1.5rem 0; }
  #notifbtn { font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1>bezel · tasks <span class="status" id="status">offline</span></h1>

  <div class="card">
    <form class="add" id="addform">
      <input id="title" placeholder="What needs doing?" autocomplete="off" required>
      <input id="due" type="datetime-local">
      <button class="primary">Add</button>
    </form>
  </div>

  <div class="card"><ul id="list"></ul><div class="empty" id="empty">nothing yet</div></div>

  <div class="card">
    <details class="settings" id="settings">
      <summary>connection</summary>
      <div class="row">
        <input id="cfg-url" placeholder="core url, e.g. http://127.0.0.1:7700">
        <input id="cfg-token" placeholder="capability token (bz1.…)" type="password">
        <button id="cfg-save">Connect</button>
        <button id="notifbtn" type="button">enable notifications</button>
      </div>
    </details>
  </div>
</main>

<script>
"use strict";
const FACET = "tasks/v1";
const CLIENT = "Tasks (Web) v0.1"; // stamped into every write's source
const LS = {
  config: "bezel.tasks.config",
  items: "bezel.tasks.items",
  cursor: "bezel.tasks.cursor",
  notified: "bezel.tasks.notified",
};
const load = (k, d) => JSON.parse(localStorage.getItem(k) ?? JSON.stringify(d));
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

let config = load(LS.config, null);      // {url, token}
let items = load(LS.items, {});          // id -> item (server shape)
let cursor = load(LS.cursor, null);      // change-feed seq, client-held
let notified = load(LS.notified, {});    // id -> updated_at we notified for

// ---------------------------------------------------------------- core client

async function api(method, path, body) {
  const res = await fetch(config.url + path, {
    method,
    headers: {
      "Authorization": "Bearer " + config.token,
      "X-Bezel-Client": CLIENT,
      ...(body !== undefined ? { "Content-Type": "application/json" } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return { status: 204, body: null };
  let json = null;
  try { json = await res.json(); } catch {}
  return { status: res.status, body: json };
}

// Register the tasks facet; 409 means it already exists, 403 means a
// narrower token — both fine.
async function ensureFacet() {
  await api("POST", "/v1/items", {
    facet: "facet",
    body: {
      name: FACET,
      strict: true,
      schema: {
        type: "object",
        required: ["title", "done"],
        properties: {
          title: { type: "string", minLength: 1 },
          done: { type: "boolean" },
          due: { type: "string", format: "date-time" },
          notes: { type: "string" },
        },
        additionalProperties: false,
      },
      lapse: { due: "due", done: "done" },
    },
  });
}

// ---------------------------------------------------------------- sync engine
// Local cache first; the change feed (cursor held client-side) keeps it true.

let syncing = false;
async function sync() {
  if (!config || syncing) return;
  syncing = true;
  try {
    if (cursor === null) await seed();
    const { status, body } = await api("GET",
      `/v1/changes?since=${cursor}&facet=${encodeURIComponent(FACET)}&limit=500`);
    if (status !== 200) throw new Error("changes " + status);
    for (const ch of body.changes) {
      if (ch.op === "deleted") {
        delete items[ch.item_id];
        delete notified[ch.item_id];
      } else if (ch.op === "lapsed") {
        await notifyIfStillDue(ch.item_id);
      } else {
        // Change rows carry the full snapshot: apply the feed directly,
        // no per-item refetch.
        items[ch.item_id] = {
          id: ch.item_id, facet: ch.facet, body: ch.body, revision: ch.revision,
          created_at: items[ch.item_id]?.created_at ?? ch.at,
          updated_at: ch.at, source: ch.source,
        };
      }
    }
    cursor = body.next;
    persist();
    setStatus("synced " + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus("offline · cached");
  } finally {
    syncing = false;
    render();
  }
}

// First contact: bulk-load items, then start the cursor at the feed's head.
async function seed() {
  const r = await api("GET", `/v1/items?facet=${encodeURIComponent(FACET)}&limit=1000`);
  if (r.status !== 200) throw new Error("seed " + r.status);
  items = Object.fromEntries(r.body.items.map(i => [i.id, i]));
  const feed = await api("GET", `/v1/changes?since=0&facet=${encodeURIComponent(FACET)}&limit=5000`);
  cursor = feed.status === 200 ? feed.body.next : 0;
  persist();
}

function persist() {
  save(LS.items, items); save(LS.cursor, cursor); save(LS.notified, notified);
}

// ---------------------------------------------------------------- notifications
// Two triggers, one dedupe: 'lapsed' events from the poker's sweep, and a
// local due-check so the client reacts between ticks. Both verify against
// the core before firing — a completed or deleted task never notifies.

async function notifyIfStillDue(id) {
  const r = await api("GET", "/v1/items/" + id);
  if (r.status !== 200) { delete items[id]; return; }
  items[id] = r.body;
  const t = r.body.body;
  if (t.done || !t.due || new Date(t.due) > new Date()) return;
  if (notified[id] === r.body.updated_at) return; // once per edit
  notified[id] = r.body.updated_at;
  persist();
  if (Notification.permission === "granted") {
    new Notification("Task due: " + t.title, {
      body: "was due " + new Date(t.due).toLocaleString(),
      tag: "bezel-task-" + id,
    });
  }
}

function localDueCheck() {
  const now = new Date();
  for (const item of Object.values(items)) {
    const t = item.body;
    if (!t.done && t.due && new Date(t.due) <= now && notified[item.id] !== item.updated_at) {
      notifyIfStillDue(item.id);
    }
  }
}

// ---------------------------------------------------------------- actions

async function addTask(title, due) {
  const body = { title, done: false, ...(due ? { due } : {}) };
  const r = await api("POST", "/v1/items", { facet: FACET, body });
  if (r.status === 201) { items[r.body.id] = r.body; persist(); render(); }
  sync();
}

// Revision-checked write; on conflict, take the server's version and retry once.
async function mutate(id, change, retried) {
  const item = items[id];
  if (!item) return;
  const r = await api("PUT", "/v1/items/" + id,
    { body: { ...item.body, ...change }, revision: item.revision });
  if (r.status === 200) { items[id] = r.body; persist(); render(); }
  else if (r.status === 409 && !retried) {
    const fresh = await api("GET", "/v1/items/" + id);
    if (fresh.status === 200) { items[id] = fresh.body; await mutate(id, change, true); }
  }
  sync();
}

async function removeTask(id) {
  const r = await api("DELETE", "/v1/items/" + id);
  if (r.status === 204 || r.status === 404) { delete items[id]; persist(); render(); }
  sync();
}

// ---------------------------------------------------------------- ui

const $ = s => document.querySelector(s);
function setStatus(s) { $("#status").textContent = s; }

function fmtDue(due) {
  const d = new Date(due), now = new Date();
  const mins = Math.round((d - now) / 60000);
  if (Math.abs(mins) < 60) return mins >= 0 ? `in ${mins}m` : `${-mins}m ago`;
  if (Math.abs(mins) < 60 * 36) {
    const h = Math.round(mins / 60);
    return h >= 0 ? `in ${h}h` : `${-h}h ago`;
  }
  return d.toLocaleDateString();
}

function render() {
  const list = $("#list");
  const sorted = Object.values(items).sort((a, b) => {
    if (a.body.done !== b.body.done) return a.body.done ? 1 : -1;
    const ad = a.body.due ?? "9999", bd = b.body.due ?? "9999";
    return ad < bd ? -1 : ad > bd ? 1 : 0;
  });
  $("#empty").style.display = sorted.length ? "none" : "block";
  list.replaceChildren(...sorted.map(item => {
    const t = item.body;
    const li = document.createElement("li");
    li.className = "task" + (t.done ? " done" : "");
    const box = document.createElement("input");
    box.type = "checkbox"; box.checked = t.done;
    box.onchange = () => mutate(item.id, { done: box.checked });
    const span = document.createElement("span");
    span.className = "t"; span.textContent = t.title;
    li.append(box, span);
    if (t.due) {
      const due = document.createElement("span");
      const overdue = !t.done && new Date(t.due) <= new Date();
      due.className = "due" + (overdue ? " overdue" : "");
      due.textContent = fmtDue(t.due);
      li.append(due);
    }
    const x = document.createElement("button");
    x.className = "x"; x.textContent = "✕"; x.title = "delete";
    x.onclick = () => removeTask(item.id);
    li.append(x);
    return li;
  }));
}

$("#addform").onsubmit = e => {
  e.preventDefault();
  const title = $("#title").value.trim();
  if (!title || !config) return;
  const dueRaw = $("#due").value;
  addTask(title, dueRaw ? new Date(dueRaw).toISOString() : null);
  $("#title").value = ""; $("#due").value = "";
};

$("#cfg-save").onclick = async () => {
  config = { url: $("#cfg-url").value.trim().replace(/\/$/, ""), token: $("#cfg-token").value.trim() };
  save(LS.config, config);
  items = {}; cursor = null; notified = {}; persist();
  await ensureFacet();
  sync();
};

$("#notifbtn").onclick = () => Notification.requestPermission();

// ---------------------------------------------------------------- boot

if (config) {
  $("#cfg-url").value = config.url; $("#cfg-token").value = config.token;
} else {
  $("#settings").open = true;
}
render();          // cache renders instantly, before any network
sync();            // then the feed trues it up
setInterval(sync, 10_000);
setInterval(localDueCheck, 15_000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") sync();
});
</script>
</body>
</html>
