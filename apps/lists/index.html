<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Content-Security-Policy, inline because this is a single file served
  from anywhere — a file:// path, a static host, whatever.

  script-src 'sha256-Sxxu/DWt8DEIYmS/2h2LmaoYRgsBUa9T2UIAci7WMP8=' 'sha256-GifrQ3F15RTx5v+RFNx4bHkJFVsRK6sxNy9ge+Jtau4='; recompute
  with:

    { printf '\n'; sed -n '/^<script>$/,/^<\/script>$/p' index.html \
      | sed '1d;$d'; } | sha256sum | cut -d' ' -f1 | xxd -r -p | base64

  connect-src stays wide open: the core's URL is whatever a pairing ticket
  or the manual fields name, so there is no origin to pin at authoring
  time. frame-ancestors is not honoured in a meta policy; serve this file
  with X-Frame-Options if you care.

  The QR scanner needs no directive of its own. The camera preview is a
  MediaStream attached with `video.srcObject`, which is an object, not a
  URL — nothing is fetched, so media-src never comes into it, and
  BarcodeDetector reads the <video> element directly with no canvas and
  no blob: URL in between.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Sxxu/DWt8DEIYmS/2h2LmaoYRgsBUa9T2UIAci7WMP8=' 'sha256-GifrQ3F15RTx5v+RFNx4bHkJFVsRK6sxNy9ge+Jtau4='; style-src 'unsafe-inline'; connect-src *; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ErisDB · lists</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --muted: #8a8578;
    --line: #e5e2da; --accent: #7a5af5; --danger: #c94f3d; --ok: #3d8b5f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17161a; --card: #201f24; --ink: #e8e6e1; --muted: #918c80;
      --line: #2e2d33; --accent: #9d85ff; --danger: #e07a68; --ok: #6cbf92;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, sans-serif;
    display: flex; justify-content: center; padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 38rem; }
  h1 { font-size: 1.1rem; letter-spacing: .04em; display: flex; align-items: baseline; gap: .5rem; }
  h1 .status { font-size: .75rem; color: var(--muted); font-weight: normal; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  input, textarea, button {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: .45rem .6rem;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  /* list chips */
  .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; padding: .2rem .75rem;
    font-size: .85rem; background: var(--card); color: var(--muted);
  }
  .chip.active { background: var(--accent); color: #fff; border-color: transparent; }
  .chip .n { opacity: .7; font-size: .75rem; margin-left: .3rem; }
  /* add form */
  form.add { display: flex; gap: .5rem; flex-wrap: wrap; }
  #f-list { flex: 0 1 9rem; }
  #f-name { flex: 1 1 12rem; }
  /* entries */
  ul { list-style: none; margin: 0; padding: 0; }
  li.entry { border-bottom: 1px solid var(--line); }
  li.entry:last-child { border-bottom: none; }
  li.entry.pending { opacity: .65; }
  .row { display: flex; align-items: baseline; gap: .6rem; padding: .55rem .2rem; cursor: pointer; }
  .row .nm { flex: 0 0 auto; }
  .row .nm a { color: var(--accent); text-decoration: none; }
  .row .nm a:hover { text-decoration: underline; }
  .row .desc { flex: 1; color: var(--muted); font-size: .85rem;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .in { color: var(--muted); font-size: .75rem; white-space: nowrap; }
  .row .in.blocked { color: var(--danger); }
  .attrs { display: flex; gap: .3rem; flex-wrap: wrap; padding: 0 .2rem .5rem; }
  .attr { font-size: .72rem; border: 1px solid var(--line); border-radius: 6px;
          padding: .05rem .4rem; color: var(--muted); }
  .attr b { color: var(--ink); font-weight: 500; }
  /* editor */
  .editor { display: flex; flex-direction: column; gap: .5rem; padding: .3rem .2rem .8rem; }
  .editor textarea { min-height: 4.5rem; resize: vertical; font-family: ui-monospace, monospace; font-size: .85rem; }
  .editor .dates { font-size: .72rem; color: var(--muted); }
  .editor .buttons { display: flex; gap: .5rem; }
  .editor .buttons .spacer { flex: 1; }
  button.danger { color: var(--danger); border-color: var(--danger); background: none; }
  .hint { font-size: .72rem; color: var(--muted); }
  details.settings summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  details.settings .row-s { display: flex; flex-direction: column; gap: .5rem; margin-top: .7rem; }
  .empty { color: var(--muted); text-align: center; padding: 1.5rem 0; }
  #cfg-state { font-size: .8rem; color: var(--muted); }
  /* pairing */
  .stack { display: flex; flex-direction: column; gap: .5rem; margin-top: .5rem; }
  .pairhead { font-size: 1rem; margin: 0 0 .2rem; }
  #pair-intro code { font-family: ui-monospace, monospace; font-size: .9em; }
  #cfg-ticket { width: 100%; resize: vertical;
                font-family: ui-monospace, monospace; font-size: .8rem; }
  #scanner { display: flex; flex-direction: column; gap: .5rem; }
  #cam { width: 100%; max-height: 60vh; background: #000; border-radius: 8px; }
  #pair-msg { font-size: .82rem; }
  /* An empty note still eats a flex gap; nothing to say is nothing to show. */
  #scan-note:empty, #pair-msg:empty { display: none; }
  #pair-msg.bad { color: var(--danger); }
  #pair-msg.good { color: var(--ok); }
  details.manual summary { cursor: pointer; color: var(--muted); font-size: .82rem; }
  /* waiting for a human to answer on the other device */
  #pair-wait { display: flex; flex-direction: column; gap: .5rem; }
  #pair-wait .pairhead { display: flex; align-items: baseline; gap: .5rem; }
  .spinner {
    width: .7rem; height: .7rem; border-radius: 50%; flex: 0 0 auto;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  ul.wants { font-size: .78rem; color: var(--muted); }
  ul.wants li { padding: .1rem 0; }
  ul.wants li::before { content: "· "; }
  #perm-banner { font-size: .85rem; color: var(--muted); }
  #perm-banner.readonly { border-color: var(--accent); }
  #perm-banner.blocked { border-color: var(--danger); color: var(--danger); }
  /* `hidden` has to beat the display rules above, so it is stated once here */
  [hidden] { display: none !important; }
  /* Unpaired, the connection card is the only card: it is the screen. */
  body.unpaired .app { display: none; }
  body.unpaired details.settings > summary { display: none; }
  body.unpaired #cfg-state,
  body.unpaired #cfg-forget { display: none; }
  body:not(.unpaired) #pair-intro { display: none; }
</style>
</head>
<body>
<main>
  <h1>ErisDB · lists <span class="status" id="status">offline</span></h1>

  <div class="card app" id="perm-banner" hidden></div>

  <div class="card app"><div class="chips" id="chips"></div></div>

  <div class="card app" id="add-card">
    <form class="add" id="addform">
      <input id="f-list" placeholder="list" autocomplete="off" required>
      <input id="f-name" placeholder="name" autocomplete="off" required>
      <button class="primary">Add</button>
    </form>
  </div>

  <div class="card app"><ul id="entries"></ul><div class="empty" id="empty">nothing yet</div></div>

  <div class="card">
    <details class="settings" id="settings">
      <summary>connection</summary>
      <div class="row-s">
        <div id="pair-intro">
          <h2 class="pairhead">Pair with a core</h2>
          <div class="hint">Run <code>erisdb pair</code> on the core and scan the QR code
            it prints. The code grants nothing on its own — this app asks for the
            permissions it needs and a person at the core answers.</div>
        </div>
        <div id="cfg-state"></div>

        <div id="pair-wait" hidden>
          <div class="pairhead"><span class="spinner"></span><span id="pair-wait-who"></span></div>
          <div class="hint" id="pair-wait-what"></div>
          <ul class="wants" id="pair-wants"></ul>
          <button id="pair-cancel" type="button">Cancel</button>
        </div>

        <div id="pair-forms" class="stack">
          <button id="scan-btn" type="button" class="primary" hidden>Scan a QR code</button>
          <div id="scanner" hidden>
            <video id="cam" playsinline muted></video>
            <button id="scan-cancel" type="button">Cancel</button>
          </div>
          <div id="scan-note" class="hint"></div>

          <label class="hint" for="cfg-ticket">Paste a pairing code</label>
          <textarea id="cfg-ticket" rows="2" placeholder="erisdb://pair/…"
                    autocomplete="off" spellcheck="false"></textarea>
          <button id="cfg-pair" type="button">Pair</button>

          <details class="manual" id="manual">
            <summary>Enter details manually</summary>
            <div class="stack">
              <input id="cfg-url" placeholder="core url, e.g. http://127.0.0.1:7700">
              <input id="cfg-token" placeholder="capability token (erisdb1.…)" type="password"
                     autocomplete="off" spellcheck="false">
              <button id="cfg-save" type="button">Connect</button>
            </div>
          </details>
        </div>

        <div id="pair-msg"></div>

        <button id="cfg-forget" type="button" class="danger">Disconnect &amp; forget token</button>
      </div>
    </details>
  </div>
</main>

<script src="../shared/auth.js" integrity="sha256-Sxxu/DWt8DEIYmS/2h2LmaoYRgsBUa9T2UIAci7WMP8="></script>
<script>
"use strict";
// The facet name is the permission namespace, so it carries no version:
// `lists:read` outlives a schema change, `lists/v1:read` would not. The
// schema version lives in the registration body instead.
const FACET = "lists";
const FACET_VERSION = 1;
const CLIENT = "Lists (Web) v0.2"; // stamped into every write's source

// ---------------------------------------------------------------- manifest
// What this app asks a human for when it pairs. Asking is free — the
// operator answers, and may answer with less — so the manifest is a wish
// and `grants` below is the truth.
//
// The four facet grants are what the app is for, and they are four rather
// than "write" because the useful answers live in between: create and
// update are separate permissions, so "may add an entry but not edit one"
// is a real reply and the UI honours it.
//
// Creating items also permits initializing this namespace's missing schema.
// No global facet administration is requested.
const WANTED = [
  `${FACET}:read`,
  `${FACET}:create`,
  `${FACET}:update`,
  `${FACET}:delete`,
];

// What each request means, for the waiting screen — the same sentences the
// facet registration hands the operator's approval prompt.
const WANT_SAYS = {
  [`${FACET}:read`]: "read your lists",
  [`${FACET}:create`]: "add entries",
  [`${FACET}:update`]: "change entries",
  [`${FACET}:delete`]: "delete entries",
};

const LS = {
  config: "erisdb.lists.config",
  items: "erisdb.lists.items",
  cursor: "erisdb.lists.cursor",
  selected: "erisdb.lists.selected",
  outbox: "erisdb.lists.outbox",
};

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------------------------------------------------------------- storage
// localStorage is a shared, hand-editable, quota-limited box, not a
// database. A truncated or corrupt value resets that one key and the app
// carries on; a full quota degrades to in-memory state and says so on the
// status line rather than throwing out of the sync loop.

let storageFull = false;

function load(k, d) {
  let raw = null;
  try { raw = localStorage.getItem(k); } catch { return d; }
  if (raw === null) return d;
  try { return JSON.parse(raw); }
  catch {
    try { localStorage.removeItem(k); } catch {}
    return d;
  }
}

function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch { return false; }
}

function forget(k) { try { localStorage.removeItem(k); } catch {} }

let config = load(LS.config, null);      // {url, token, name, ttl, grants}
let items = load(LS.items, {});          // id -> item, the server's snapshot
let cursor = load(LS.cursor, null);      // change-feed seq, client-held
let selected = load(LS.selected, null);  // list name filter, null = all
let outbox = load(LS.outbox, []);        // durable queue of unsent mutations
let editing = null;                      // id of the expanded entry

if (!Array.isArray(outbox)) outbox = [];
if (items === null || typeof items !== "object") items = {};
if (typeof selected !== "string") selected = null;

// ---------------------------------------------------------------- core client

async function api(method, path, body, retry = true) {
  if (!config) throw new Error("not connected");
  const session = config;
  const res = await fetch(ErisDBAuth.baseURL(session.url) + path, {
    redirect: "error", cache: "no-store",
    method,
    headers: {
      "Authorization": "Bearer " + session.token,
      "X-ErisDB-Client": CLIENT,
      ...(body !== undefined ? { "Content-Type": "application/json" } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 && retry && config === session && session.refreshSecret) {
    await refreshToken(true);
    if (config?.url === session.url && config.refreshSecret === session.refreshSecret && config.token !== session.token) {
      return api(method, path, body, false); // 401 precedes every server-side effect.
    }
  }
  if (res.status === 204) return { status: 204, body: null };
  let json = null;
  try { json = await res.json(); } catch {}
  return { status: res.status, body: json };
}

// ---------------------------------------------------------------- capability
// A token is `erisdb1.<b64url(payload)>.<b64url(sig)>` and the payload is JSON
// carrying an optional `exp` in unix seconds. The client reads exp to know
// when to refresh; the signature is the core's business, and the token
// goes nowhere but the API. It is never written back into the DOM: the
// settings panel shows a configured state, not the secret.

function tokenExp(token) {
  try {
    const b64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    const exp = JSON.parse(atob(b64)).exp;
    return typeof exp === "number" ? exp : null;   // null: never expires
  } catch { return null; }
}

// ---------------------------------------------------------------- grants
// What this token may actually do, as GET /v1/permissions reports it. The
// operator may approve less than the manifest asked for, so every control
// on the screen is drawn from this rather than from WANTED.
//
// `null` means "not asked yet". A token adopted from storage is still a
// valid token, so the app stays fully usable and learns the truth on its
// first sync; graying the screen out on boot and un-graying it a moment
// later would be a worse lie than being briefly optimistic. A refused write
// is caught safely either way: 403 is permanent, so the op leaves the
// outbox with its reason instead of jamming the queue.
let grants = config?.grants ?? null;

// Set when a write comes back 403: the grants on file are behind whatever
// the core believes, so the next sync re-reads them.
let permsStale = true;

/**
 * Does one grant cover one concrete permission? The rule is
 * docs/permissions.md: a `*` segment matches exactly one segment, and a `*`
 * in FINAL position matches all remaining segments. That is what makes `*`
 * alone mean everything and `lists:*` reach `lists:create`, and why
 * `*:read` does not reach `meta:facets:read` — its last segment is the
 * literal `read`, so it matches exactly two segments.
 */
function covers(grant, permission) {
  const g = grant.split(":"), p = permission.split(":");
  for (let i = 0; i < g.length; i++) {
    if (g[i] === "*" && i === g.length - 1) return p.length > i;
    if (i >= p.length || (g[i] !== "*" && g[i] !== p[i])) return false;
  }
  return g.length === p.length;
}

/** May this app do `action`? A bare action names this app's own facet, so
 * `can("create")` asks about `lists:create`; a qualified one is asked as
 * written, so `can("meta:facets:write")` asks about exactly that. */
function can(action) {
  if (grants === null) return true;
  const permission = action.includes(":") ? action : `${FACET}:${action}`;
  return grants.some(g => covers(g, permission));
}

/** Ask the core what this token holds. Needs no permission of its own — a
 * caller may always ask what it already has — and it is the only authority
 * on the answer, since an operator may have approved a subset. */
async function loadPermissions() {
  const r = await api("GET", "/v1/permissions");
  if (r.status === 401) { expired(); return false; }
  if (r.status !== 200 || !Array.isArray(r.body?.grants)) throw new Error("permissions " + r.status);
  grants = r.body.grants;
  config = { ...config, grants };
  save(LS.config, config);
  renderPermissions();
  return true;
}

// Trade a still-valid token for one with the same scope and the same
// lifetime the admin chose. Past the half-life, sync() calls this; one
// refresh is in flight at a time and a failure simply waits for the next
// sync. The open stream keeps its old, still-valid token and picks the
// fresh one up when it reconnects.
let refreshing = null;
function refreshToken(force = false) {
  if (refreshing) return refreshing;
  if (!config?.ttl && !config?.refreshSecret) return Promise.resolve();
  const exp = tokenExp(config.token);
  if (!force && (exp === null || exp - Date.now() / 1000 >= config.ttl / 2)) return Promise.resolve();
  const session = config;
  refreshing = (async () => {
    try {
      const r = await ErisDBAuth.renew(session);
      if (config?.url !== session.url || config.token !== session.token || config.refreshSecret !== session.refreshSecret) return;
      if (r.status === 200 || r.status === 201) {
        config = { ...config, token: r.body.token, grants: r.body.grants ?? config.grants };
        grants = config.grants;
        renderPermissions();
        save(LS.config, config);
        renderConfigState();
      } else if (r.status === 401) {
        expired();
      }
    } catch {} // Offline credentials remain available for the next sync.
  })().finally(() => { refreshing = null; });
  return refreshing;
}

// Registered renewal can recover expired access. A refused installation
// must pair again; manual tokens still have a bounded refresh chain.
function expired() {
  setStatus(config?.refreshSecret ? "access revoked · pair again" : "token expired · pair again");
  $("#settings").open = true;
}

// Drop the capability and everything derived from it. The queued writes
// go too — they are addressed to a core this browser no longer holds a
// token for.
function disconnect() {
  config = null;
  grants = null; permsStale = false; facetMissing = false;
  items = {}; cursor = null; selected = null; outbox = []; editing = null; lastDrop = null;
  for (const k of Object.values(LS)) forget(k);
  streamAbort?.abort();
  stopScan();
  cancelPairing();
  $("#cfg-url").value = "";
  $("#cfg-token").value = "";
  $("#cfg-ticket").value = "";
  pairMsg("");
  renderPairState();
  renderConfigState();
  renderPermissions();
  render();
  setStatus("disconnected");
}

// ---------------------------------------------------------------- pairing
// A ticket is `erisdb://pair/<base64url-nopad(JSON)>` naming where the core
// is and carrying a pairing CODE. The format is docs/pairing.md, and it is
// base64url of JSON precisely so that a browser reads one with atob and
// JSON.parse and nothing else.
//
// The code is not a capability over any data: it holds exactly
// `meta:pairing:redeem`, names one session, and expires in minutes.
// Pairing is two phases with a human in between:
//
//   redeem   POST /v1/pair/redeem — the app says who it is and what it wants
//   wait     GET  /v1/pair/status — until a person approves, narrows, or denies
//   collect  the same poll returns the token, ONCE
//
// So a photographed QR code is worth nothing on its own. It gets whoever
// took it as far as raising a prompt on the operator's screen, naming an
// app they did not install and asking for permissions they can refuse.

const PAIR_PREFIX = "erisdb://pair/";

// These apps speak HTTP over fetch(). A ticket carrying only an endpoint
// id names a core reachable over iroh, and no browser can dial one.
const EID_ONLY =
  "This core is reachable over iroh only — the code carries an endpoint id and no url, " +
  "and a browser cannot dial iroh. Pair the Android app with this code, or serve the " +
  "core over http and run erisdb pair again for a ticket with a url in it.";

/** Unpadded base64url to text, strictly: anything that is not clean
 * base64url of valid UTF-8 throws rather than decoding to mojibake. */
function decodeB64url(s) {
  if (!/^[A-Za-z0-9_-]+$/.test(s)) throw new Error("not base64url");
  const b64 = s.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "=".repeat((4 - b64.length % 4) % 4));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
}

/**
 * Parse and validate a pairing ticket, returning `{name, eid, url, code}`
 * with `name` and `eid` null when the ticket omits them. `code` is the
 * ticket's `token` field under the name that says what it is: a redeem
 * secret for one session, not a capability over anything.
 *
 * Every rejection throws with a message naming what is wrong. Nothing
 * here is guessed or repaired: refusing loudly beats storing half a
 * config, and a scanner that silently stores rubbish looks like a scanner
 * that does not work.
 */
function parseTicket(str) {
  const s = String(str ?? "").trim();
  if (!s.startsWith(PAIR_PREFIX)) {
    throw new Error("not a pairing code — it has to start with " + PAIR_PREFIX);
  }
  const payload = s.slice(PAIR_PREFIX.length);
  if (!payload) throw new Error("pairing code carries no payload after " + PAIR_PREFIX);
  let text;
  try { text = decodeB64url(payload); }
  catch { throw new Error("pairing code is damaged — the payload is not valid base64url"); }
  let t;
  try { t = JSON.parse(text); }
  catch { throw new Error("pairing code is damaged — the payload is not JSON"); }
  if (t === null || typeof t !== "object" || Array.isArray(t)) {
    throw new Error("pairing code is damaged — the payload is not a ticket object");
  }
  if (t.v !== 1) {
    throw new Error("pairing code is version " + JSON.stringify(t.v) +
      " and this app speaks version 1 — update the app, or cut a v1 ticket");
  }
  if (typeof t.token !== "string" || !t.token) {
    throw new Error("pairing code carries no secret to redeem");
  }
  const hasEid = t.eid !== undefined && t.eid !== null;
  const hasUrl = t.url !== undefined && t.url !== null;
  if (!hasEid && !hasUrl) {
    throw new Error("pairing code names neither a url nor an endpoint id");
  }
  if (hasEid && !(typeof t.eid === "string" && /^[0-9a-f]{64}$/.test(t.eid))) {
    throw new Error("pairing code's endpoint id is not 64 lowercase hex characters");
  }
  let url = null;
  if (hasUrl) {
    // The url is dialled with fetch() from this origin, so the scheme is
    // decided by the URL parser — parseUrl is the one in the links
    // section — and only http(s) is dialled at all.
    const u = typeof t.url === "string" ? parseUrl(t.url) : null;
    if (!u || (u.protocol !== "http:" && u.protocol !== "https:")) {
      throw new Error("pairing code's url is not an http or https url");
    }
    url = ErisDBAuth.baseURL(t.url);
  }
  return {
    name: typeof t.name === "string" && t.name.trim() ? t.name.trim() : null,
    eid: hasEid ? t.eid : null,
    url,
    code: t.token,
  };
}

/**
 * Adopt a capability: store it, learn what it holds, register the facet if
 * that was allowed, start syncing. Every path that ends in a url and a
 * token comes through here.
 *
 * The token is written to storage before the first `await`, because the
 * installation proof can recover a lost collection response while the
 * pairing ticket remains live.
 */
async function connect(url, token, name, granted, refreshSecret = null) {
  url = ErisDBAuth.baseURL(url);
  const sameInstallation = config?.url === url && refreshSecret && config.refreshSecret === refreshSecret;
  // The token's remaining life is the lifetime to keep renewing at; a
  // token without an exp never expires, so it never refreshes.
  const exp = tokenExp(token);
  config = {
    url, token, name: name ?? null, refreshSecret,
    grants: Array.isArray(granted) ? granted : null,
    ttl: exp === null ? null : Math.max(1, Math.round(exp - Date.now() / 1000)),
  };
  save(LS.config, config);
  grants = config.grants;
  permsStale = false; facetMissing = false;
  if (!sameInstallation) {
    items = {}; cursor = null; outbox = []; editing = null; lastDrop = null;
  }
  cursor = null; // Re-fetch the newly approved scope without losing queued work.
  persist(); saveOutbox();
  renderPairState();
  renderConfigState();
  renderPermissions();
  render();
  // An approval carries what was granted, but the token itself is the
  // authority on it, so the UI settles on the core's answer.
  try { await loadPermissions(); } catch {}
  try { await ensureFacet(); } catch {}
  streamAbort?.abort();   // the loop reconnects against the new config
  streamLoop();
}

// A pairing conversation in flight: the code, the core it came from, and a
// `live` flag the cancel button clears so an in-flight poll stands down.
const PENDING_PAIR = "erisdb.lists.pending-pair";
let pairing = null;

/** One request carrying the pairing code. This is the entire conversation
 * an app has before it holds a capability of its own, so it speaks to two
 * endpoints and no others. */
async function codeFetch(base, code, method, path, body, proof) {
  const res = await fetch(ErisDBAuth.baseURL(base) + path, {
    redirect: "error", cache: "no-store",
    method,
    headers: {
      "Authorization": "Bearer " + code,
      ...(proof ? { "X-ErisDB-Client-Proof": proof } : {}),
      "X-ErisDB-Client": CLIENT,
      ...(body !== undefined ? { "Content-Type": "application/json" } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let json = null;
  try { json = await res.json(); } catch {}
  return { status: res.status, body: json };
}

/** A scanned or pasted ticket, all the way to a paired app: redeem the
 * code, wait for a person, collect the token. */
async function pairWith(str) {
  let t;
  try { t = parseTicket(str); }
  catch (e) { pairMsg(e.message, "bad"); return; }
  if (!t.url) { pairMsg(EID_ONLY, "bad"); return; }
  cancelPairing();
  $("#cfg-ticket").value = "";
  $("#cfg-url").value = t.url;
  const who = t.name ?? t.url;
  let identity;
  try { identity = await ErisDBAuth.identity(config?.url === t.url ? config.refreshSecret : null); }
  catch (error) { pairMsg(error.message, "bad"); return; }
  pairing = { code: t.code, url: t.url, name: t.name, proof: identity.secret, challenge: identity.challenge, live: true };
  const mine = pairing;
  if (!save(PENDING_PAIR, mine)) { failPairing("Cannot save the pairing identity. Enable local storage and try again."); return; }
  showWaiting(who, `asking ${who} for permission…`);

  let r;
  try {
    r = await codeFetch(t.url, t.code, "POST", "/v1/pair/redeem",
      { client: CLIENT, requested: WANTED, challenge: identity.challenge });
  } catch {
    if (mine.live) {
      failPairing("Could not reach the core at " + t.url + ". Check it is running and " +
        "that this device can reach that address, then pair again.");
    }
    return;
  }
  if (!mine.live) return;                 // cancelled while the request was out
  if (r.status !== 200) { failPairing(redeemError(r)); return; }
  showWaiting(who, `Compare ${r.body.body.fingerprint} with the terminal before approving on ${who}.`);
  pollPairing(who, mine);
}

/** Why a redeem was refused, in words a person can act on. */
function redeemError(r) {
  if (r.status === 400) {
    return "That pairing code has expired — a code is good for about ten minutes. " +
      "Run erisdb pair on the core again for a fresh one.";
  }
  if (r.status === 401) {
    return "This core will not accept that pairing code. Run erisdb pair on the core " +
      "you mean to pair with, and use the code it prints.";
  }
  if (r.status === 409) {
    return "That pairing code has already been used — each one pairs one app, once. " +
      "Run erisdb pair on the core again for a fresh one.";
  }
  return "The core refused the pairing request: " + detail(r);
}

/**
 * Wait for the human. `requested` is the wait itself; `approved` hands the
 * token to the proven installation. Store it before proceeding; `denied`
 * is a plain answer rather than a transport error.
 */
async function pollPairing(who, mine) {
  while (mine.live) {
    let r;
    try { r = await codeFetch(mine.url, mine.code, "GET", "/v1/pair/status", undefined, mine.proof); }
    catch { await sleep(2000); continue; }   // the core blinked; keep waiting
    if (!mine.live) return;
    if (r.status === 200) {
      if (r.body?.status === "requested") showWaiting(who, `Compare ${r.body.fingerprint} with the terminal before approving on ${who}.`);
      if (r.body?.status === "approved") {
        if (typeof r.body.token !== "string" || !r.body.token) {
          failPairing("The core returned an approval without a token. Update the core and pair again.");
          return;
        }
        const { token, granted } = r.body;
        const { url, name } = mine;
        mine.live = false; pairing = null;
        hideWaiting();
        await connect(url, token, name, granted, mine.proof);
        forget(PENDING_PAIR);
        pairMsg("paired with " + who, "good");
        setStatus("paired with " + who);
        $("#settings").open = false;   // pairing is done: land in the app
        return;
      }
      if (r.body?.status === "denied") {
        failPairing("The request was refused on " + who + ", so this app was given " +
          "nothing. Run erisdb pair on the core again to ask once more.");
        return;
      }
    } else if (r.status === 409) {
      failPairing("This installation changed after approval. Start a fresh pairing and approve its current permissions.");
      return;
    } else if (r.status === 400 || r.status === 401 || r.status === 404) {
      failPairing("The pairing code ran out before anyone answered — a code is good for " +
        "about ten minutes. Run erisdb pair on the core again for a fresh one.");
      return;
    }
    await sleep(1500);
  }
}

/** Stop waiting. The session on the core is left exactly as it is — the
 * operator may still answer it — but this app is no longer listening. */
function cancelPairing() {
  if (pairing) pairing.live = false;
  pairing = null;
  forget(PENDING_PAIR);
  hideWaiting();
}

function failPairing(message) {
  cancelPairing();
  pairMsg(message, "bad");
  setStatus(config ? "not paired again" : "not paired");
}

/** Between redeem and answer there is a person walking to a keyboard, so
 * the wait is a state with a name, a list of what was asked for, and a way
 * out — not a spinner that could mean anything. */
function showWaiting(who, what) {
  pairMsg("");
  $("#pair-wait-who").textContent = who;
  $("#pair-wait-what").textContent = what;
  $("#pair-wants").replaceChildren(...WANTED.map(g => {
    const li = document.createElement("li");
    li.textContent = WANT_SAYS[g] ?? g;
    return li;
  }));
  $("#pair-wait").hidden = false;
  $("#pair-forms").hidden = true;   // one thing on screen while waiting
  setStatus("waiting for approval");
}

function hideWaiting() {
  $("#pair-wait").hidden = true;
  $("#pair-forms").hidden = false;
}

function pairMsg(text, kind) {
  const el = $("#pair-msg");
  el.textContent = text;
  el.className = text ? (kind ?? "") : "";
}

/** Unpaired, the connection card is the whole screen — the app behind it
 * has nothing to show until a core is behind it. */
function renderPairState() {
  document.body.classList.toggle("unpaired", !config);
  if (!config) $("#settings").open = true;
}

// ---------------------------------------------------------------- scanning
// BarcodeDetector is the browser's own QR decoder: Chrome, Edge and the
// Android WebView have it, Firefox and desktop Safari do not. There is no
// bundled fallback decoder, because this app is one file with no
// dependencies — where the camera path cannot work, the paste path is the
// path, and the Scan button is not drawn at all. A button that cannot
// work is worse than no button.
//
// getUserMedia exists only in a secure context, and these apps are often
// served over plain http on a LAN, where it is simply absent. That is the
// likeliest reason scanning is unavailable here, so it is tested first
// and named plainly: it is a fact about browsers, not a fault in the app.

let scanAvailable = false;
let camStream = null;
let scanTimer = null;
let scanning = false;

async function qrDecoderAvailable() {
  if (!("BarcodeDetector" in window)) return false;
  try {
    const formats = await BarcodeDetector.getSupportedFormats();
    return Array.isArray(formats) && formats.includes("qr_code");
  } catch { return false; }
}

/** Decide once whether to offer the camera, and say why when not. */
async function initScanning() {
  let why = null;
  if (window.isSecureContext === false) {
    why = "Scanning needs the camera, and a browser only grants one over https or on " +
      "localhost. This page is plain http, so paste the pairing code instead — " +
      "erisdb pair prints it as text under the QR.";
  } else if (!navigator.mediaDevices?.getUserMedia) {
    why = "This browser gives the page no camera, so paste the pairing code instead — " +
      "erisdb pair prints it as text under the QR.";
  } else if (!await qrDecoderAvailable()) {
    why = "This browser has no built-in QR decoder — Chrome, Edge and the Android app " +
      "do. Paste the pairing code instead: erisdb pair prints it as text under the QR.";
  }
  scanAvailable = why === null;
  $("#scan-btn").hidden = !scanAvailable;
  $("#scan-note").textContent = why ?? "";
  // With no camera, pasting is the primary path and should look like it.
  $("#cfg-pair").classList.toggle("primary", !scanAvailable);
}

async function startScan() {
  if (scanning || !scanAvailable) return;
  scanning = true;
  pairMsg("");
  $("#scan-btn").hidden = true;
  $("#scanner").hidden = false;
  let detector;
  try { detector = new BarcodeDetector({ formats: ["qr_code"] }); }
  catch {
    stopScan();
    pairMsg("This browser cannot decode QR codes — paste the pairing code instead.", "bad");
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    stopScan();
    pairMsg(
      e?.name === "NotAllowedError"
        ? "Camera permission denied. Allow the camera for this page and scan again, or " +
          "paste the pairing code instead."
        : e?.name === "NotFoundError"
          ? "No camera on this device — paste the pairing code instead."
          : "The camera would not open (" + (e?.name ?? "unknown") + "). Paste the " +
            "pairing code instead.",
      "bad");
    return;
  }
  // Cancelled while the permission prompt was up: the tracks still have
  // to be stopped, or the camera stays lit with nothing showing it.
  if (!scanning) {
    for (const track of camStream.getTracks()) track.stop();
    camStream = null;
    return;
  }
  const video = $("#cam");
  video.srcObject = camStream;
  try { await video.play(); } catch {}
  pairMsg("point the camera at the QR code from erisdb pair");
  scanFrame(detector, video);
}

/** One frame, then the next. A QR that is not a ticket is not a reason to
 * put the camera away — say so and keep looking. */
async function scanFrame(detector, video) {
  if (!scanning) return;
  try {
    const codes = await detector.detect(video);
    if (!scanning) return;
    const hit = codes.find(c =>
      typeof c.rawValue === "string" && c.rawValue.trim().startsWith(PAIR_PREFIX));
    if (hit) { stopScan(); pairWith(hit.rawValue); return; }
    if (codes.length) {
      pairMsg("that QR code is not an ErisDB pairing code — run erisdb pair on the core");
    }
  } catch {}                  // a frame read before the video has one
  if (scanning) scanTimer = setTimeout(() => scanFrame(detector, video), 120);
}

/** Every exit from the camera runs through here: success, cancel, error,
 * disconnect, and the page going away. A camera left running on a phone
 * is not a small thing. */
function stopScan() {
  scanning = false;
  clearTimeout(scanTimer);
  scanTimer = null;
  if (camStream) {
    for (const track of camStream.getTracks()) track.stop();
    camStream = null;
  }
  const video = $("#cam");
  video.pause();
  video.srcObject = null;
  $("#scanner").hidden = true;
  $("#scan-btn").hidden = !scanAvailable;
}

// The lists facet. Timestamps live on the item envelope (created_at /
// updated_at), so the body carries none.
const FACET_BODY = {
  name: FACET,
  version: FACET_VERSION,
  strict: true,
  // Human sentences for the approval prompt, so the operator reads "add
  // entries" rather than "lists:create". Presentation only: no grant
  // depends on them, and a missing one shows the raw permission.
  permissions: {
    read: "read your lists",
    create: "add entries",
    update: "change entries",
    delete: "delete entries",
  },
  schema: {
    type: "object",
    required: ["list", "name"],
    properties: {
      list: { type: "string", minLength: 1 },
      name: { type: "string", minLength: 1 },
      description: { type: "string" },
      link: { type: "string" },
      attributes: {
        type: "object",
        additionalProperties: {
          anyOf: [
            { type: ["string", "number", "boolean", "null"] },
            { type: "array" },
          ],
        },
      },
    },
    additionalProperties: false,
  },
};

// True once a write comes back `unknown_facet`: the core has never been
// told what a list entry is. Not the user's fault and not a property of
// their data, so it is named plainly on screen instead of surfacing as a
// schema error nobody can act on.
let facetMissing = false;

async function ensureFacet() {
  if (!can("create") && !can("meta:facets:write")) return true;
  const r = await api("POST", "/v1/items", { facet: "facet", body: FACET_BODY });
  facetMissing = r.status !== 201 && r.status !== 409;
  if (r.status === 403) permsStale = true;
  renderPermissions();
  return !facetMissing;
}

// ---------------------------------------------------------------- outbox
// Offline-first: every mutation is written to the outbox BEFORE the
// network is touched, so closing the tab mid-write loses nothing and the
// op replays on next load. What the screen shows is the server snapshot
// with the queued ops replayed on top, so an edit is visible instantly.
//
// Ops:
//   {op:"create", tmp, at, body}
//   {op:"update", id, patch}
//   {op:"delete", id}
//
// A patch is a shallow overlay on the item's body; a key set to null
// removes the field, which a strict schema needs for optional fields.

function merge(base, patch) {
  const out = { ...base };
  for (const [k, v] of Object.entries(patch)) {
    if (v === null) delete out[k]; else out[k] = v;
  }
  return out;
}

function saveOutbox() { if (!save(LS.outbox, outbox)) storageFull = true; }

// A permanently refused write is data the user will not get back, so its
// reason outlives the sync that discovered it: the status line holds it
// until the next mutation, rather than flashing it for one poll.
let lastDrop = null;

/** Durable first, then optimistic, then sync. */
function enqueue(op) {
  lastDrop = null;
  outbox.push(op);
  saveOutbox();
  render();
  sync();
}

/** The truth the user sees: the server snapshot plus everything queued. */
function view() {
  const out = { ...items };
  for (const op of outbox) {
    if (op.op === "create") {
      out[op.tmp] = {
        id: op.tmp, facet: FACET, body: op.body, revision: 0,
        created_at: op.at, updated_at: op.at, pending: true,
      };
    } else if (op.op === "update") {
      const cur = out[op.id];
      if (cur) out[op.id] = { ...cur, body: merge(cur.body, op.patch), pending: true };
    } else if (op.op === "delete") {
      delete out[op.id];
    }
  }
  return out;
}

// Statuses worth waiting out: the token can be replaced, a 5xx passes.
// Everything else in the 4xx range is the core saying no, permanently.
const retryable = s => s === 401 || s === 408 || s === 425 || s === 429 || s >= 500;

const detail = r => r.body?.detail ?? r.body?.error ?? ("status " + r.status);

/**
 * A permanent refusal, as an outbox drop: the op leaves the queue carrying
 * the reason, which is what keeps one refused write from jamming every
 * write behind it.
 *
 * Two refusals say something the screen should react to as well. 403 means
 * the grants on file are behind whatever the core believes, so they are
 * re-read; `unknown_facet` keeps the write queued until setup succeeds.
 */
function refused(r, what) {
  if (r.status === 403) permsStale = true;
  if (r.body?.error === "unknown_facet") {
    facetMissing = true;
    return null; // Keep the entry queued; setup is retried before the next create.
  }
  return { drop: what + " refused: " + detail(r) };
}

/**
 * Send one op. Returns null to keep it queued (transport down or a
 * transient status), otherwise `{item?, drop?}` — the op leaves the queue
 * either way, `drop` carrying the reason it was refused for good.
 */
async function sendOp(op) {
  try {
    if (op.op === "create") {
      if (!await ensureFacet()) return null;
      const r = await api("POST", "/v1/items", { facet: FACET, body: op.body });
      if (r.status === 201) { facetMissing = false; return { item: r.body }; }
      return retryable(r.status) ? null : refused(r, "create");
    }
    if (op.op === "update") {
      // The patch is the intent, so it is replayed onto whatever body the
      // core currently holds — a concurrent edit to a field this op never
      // named survives instead of being clobbered.
      for (let attempt = 0; attempt < 2; attempt++) {
        let base = items[op.id];
        if (!base || attempt > 0) {
          const fresh = await api("GET", "/v1/items/" + op.id);
          if (fresh.status === 404) return { drop: "edit dropped: item gone" };
          if (fresh.status !== 200) {
            return retryable(fresh.status) ? null : refused(fresh, "edit");
          }
          items[op.id] = base = fresh.body;
        }
        const r = await api("PUT", "/v1/items/" + op.id,
          { body: merge(base.body, op.patch), revision: base.revision });
        if (r.status === 200) return { item: r.body };
        if (r.status === 404) return { drop: "edit dropped: item gone" };
        if (r.status === 409 && attempt === 0) continue;   // take theirs, replay ours
        if (r.status === 409) return { drop: "edit refused: revision conflict persisted" };
        if (retryable(r.status)) return null;
        return refused(r, "edit");
      }
    }
    if (op.op === "delete") {
      const r = await api("DELETE", "/v1/items/" + op.id);
      if (r.status === 204 || r.status === 404) return {};
      return retryable(r.status) ? null : refused(r, "delete");
    }
  } catch {
    return null;   // transport down: the op stays queued, in order
  }
  return { drop: "unknown op" };
}

/** A create's synthetic id becomes the real one for everything still
 * queued behind it — a later edit or delete must never address an id the
 * core has never seen. */
function retarget(tmp, item) {
  for (const o of outbox) if (o.id === tmp) o.id = item.id;
  if (editing === tmp) editing = item.id;
}

/** A create the core refused permanently leaves nothing to edit or
 * delete: everything queued against it goes with it. */
function retire(tmp) {
  outbox = outbox.filter(o => o.id !== tmp);
  if (editing === tmp) editing = null;
}

// Drain in order and stop at the first thing worth retrying, so ordering
// holds. One drain at a time: a second entrant would race the queue.
let draining = false;
async function drainOutbox() {
  if (draining) return;
  draining = true;
  try {
    while (outbox.length) {
      const op = outbox[0];
      const res = await sendOp(op);
      if (res === null) break;
      outbox.shift();
      if (op.op === "create") {
        if (res.item) { items[res.item.id] = res.item; retarget(op.tmp, res.item); }
        else retire(op.tmp);
      } else if (op.op === "update" && res.item) {
        items[res.item.id] = res.item;
      } else if (op.op === "delete") {
        delete items[op.id];
        if (editing === op.id) editing = null;
      }
      if (res.drop) lastDrop = res.drop;
      saveOutbox();
      persist();
    }
  } finally {
    draining = false;
  }
}

// ---------------------------------------------------------------- sync engine
// Local cache first; the change feed (cursor held client-side) keeps it true.

// One change row applied to the cache. The cursor poll and the live
// stream both land here — the feed is the only way server state changes.
// Change rows carry the full snapshot: apply the feed directly, no
// per-item refetch.
function applyChange(ch) {
  if (ch.op === "deleted") {
    delete items[ch.item_id];
  } else if (ch.body) {
    items[ch.item_id] = {
      id: ch.item_id, facet: ch.facet, body: ch.body, revision: ch.revision,
      created_at: items[ch.item_id]?.created_at ?? ch.at,
      updated_at: ch.at, source: ch.source,
    };
  }
}

let syncing = false, syncAgain = false;
async function sync() {
  if (!config) return;
  if (syncing) { syncAgain = true; return; }   // fold the request into the run in flight
  syncing = true;
  try {
    await refreshToken();
    // A token adopted from storage reports what it holds on the first sync,
    // and a refused write sends the app back to ask again. Everything the
    // screen offers or withholds follows from the answer.
    permsStale = false;
    if (!await loadPermissions()) return;
    await drainOutbox();
    if (cursor === null) await seed();
    const { status, body } = await api("GET",
      `/v1/changes?since=${cursor}&facet=${encodeURIComponent(FACET)}&limit=500`);
    if (status === 401) { expired(); return; }
    if (status !== 200) throw new Error("changes " + status);
    for (const ch of body.changes) applyChange(ch);
    cursor = Math.max(cursor, body.next);   // the stream may be ahead
    persist();
    setStatus(lastDrop ?? (outbox.length
      ? `${outbox.length} queued`
      : (streamLive ? "live · " : "synced ") + new Date().toLocaleTimeString()));
  } catch (e) {
    setStatus(lastDrop ??
      (outbox.length ? `offline · ${outbox.length} queued` : "offline · cached"));
  } finally {
    syncing = false;
    render();
    if (syncAgain) { syncAgain = false; sync(); }
  }
}

// First contact: bulk-load items, then start the cursor at the feed's head.
async function seed() {
  const r = await api("GET", `/v1/items?facet=${encodeURIComponent(FACET)}&limit=1000`);
  if (r.status !== 200) throw new Error("seed " + r.status);
  items = Object.fromEntries(r.body.items.map(i => [i.id, i]));
  const feed = await api("GET", `/v1/changes?since=0&facet=${encodeURIComponent(FACET)}&limit=5000`);
  cursor = feed.status === 200 ? feed.body.next : 0;
  persist();
}

function persist() {
  const ok = [save(LS.items, items), save(LS.cursor, cursor),
              save(LS.selected, selected)];
  storageFull = ok.includes(false);
}

// ---------------------------------------------------------------- live stream
// GET /v1/changes/stream is SSE, woken by Postgres NOTIFY. The capability
// rides an Authorization header, which EventSource cannot set, so the
// stream is read off fetch's ReadableStream instead. The cursor stays
// client-held: every connection opens at ?since=<cursor>, so a drop costs
// nothing but a reconnect.

let streamLive = false;
let streamAbort = null;

async function stream() {
  const ctl = new AbortController();
  streamAbort = ctl;
  let connected = false;
  try {
    const res = await fetch(ErisDBAuth.baseURL(config.url) +
      `/v1/changes/stream?since=${cursor}&facet=${encodeURIComponent(FACET)}`, {
      headers: { "Authorization": "Bearer " + config.token, "X-ErisDB-Client": CLIENT },
      signal: ctl.signal, redirect: "error", cache: "no-store",
    });
    if (res.status === 401) { expired(); return false; }
    if (!res.ok || !res.body) throw new Error("stream " + res.status);
    connected = true;
    streamLive = true;
    setStatus("live");
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
      // Frames are blank-line separated; keep-alive comments parse to nothing.
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        applyFrame(buf.slice(0, i));
        buf = buf.slice(i + 2);
      }
    }
  } catch (e) {
    if (config) setStatus("stream lost · polling");   // a disconnect aborts on purpose
  } finally {
    streamLive = false;
    streamAbort = null;
  }
  return connected;
}

function applyFrame(frame) {
  let event = "message", data = "";
  for (const line of frame.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).replace(/^ /, "");
  }
  if (event !== "change" || !data) return;
  let ch;
  try { ch = JSON.parse(data); } catch { return; }
  applyChange(ch);
  if (ch.seq > cursor) cursor = ch.seq;
  persist();
  render();
  setStatus("live · " + new Date().toLocaleTimeString());
}

// Catch up on the cursor, then hold a stream open; on any drop, catch up
// again and reconnect with backoff. One loop at a time — a reconfigure
// aborts the open stream and the same loop picks the new config up.
let streaming = false;
async function streamLoop() {
  if (streaming) return;
  streaming = true;
  let backoff = 1000;
  try {
    while (config) {
      await sync();
      if (!config) break;
      if (cursor !== null && await stream()) backoff = 1000;
      if (!config) break;
      await sleep(backoff);
      backoff = Math.min(backoff * 2, 30_000);
    }
  } finally {
    streaming = false;
  }
}

// ---------------------------------------------------------------- actions

// A synthetic id for an item the core has not seen yet. randomUUID needs
// a secure context; the fallback only has to be unique within one queue.
const uid = () => (crypto.randomUUID?.() ??
  Date.now().toString(36) + "-" + Math.random().toString(36).slice(2));

function addEntry(list, name) {
  enqueue({ op: "create", tmp: "pending-" + uid(), at: new Date().toISOString(),
            body: { list, name } });
}

function mutate(id, patch) {
  if (!view()[id]) return;
  enqueue({ op: "update", id, patch });
}

function removeEntry(id) {
  if (!view()[id]) return;
  if (editing === id) editing = null;
  enqueue({ op: "delete", id });
}

// ---------------------------------------------------------------- attributes
// Frontmatter-style text: one `key: value` per line. Values parse as JSON
// where they can (numbers, booleans, null, arrays) and fall back to string.

function attrsToText(attrs) {
  return Object.entries(attrs ?? {})
    .map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`)
    .join("\n");
}

function textToAttrs(text) {
  const attrs = {};
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    const i = line.indexOf(":");
    if (i < 1) throw new Error(`bad attribute line: ${line}`);
    const key = line.slice(0, i).trim();
    const raw = line.slice(i + 1).trim();
    let value = raw;
    try {
      const parsed = JSON.parse(raw);
      if (parsed === null || ["number", "boolean", "string"].includes(typeof parsed)
          || Array.isArray(parsed)) value = parsed;
    } catch {}
    attrs[key] = value;
  }
  return attrs;
}

// ---------------------------------------------------------------- links
// An item body is shared server-side state: any client holding a write
// token — a phone, a browser, an LLM through erisdb-mcp — can set `link`.
// An href is therefore untrusted input, and `javascript:` in one would
// execute in this origin, where the capability token lives.
//
// The scheme is decided by the URL parser, never by string matching:
// " javascript:x", "java\tscript:x" and "JaVaScRiPt:x" all defeat a
// prefix test and none of them defeat parsing. Anything outside the
// allowlist renders as inert text.

const LINK_SCHEMES = new Set(["http:", "https:", "mailto:"]);
const HAS_SCHEME = /^[a-z][a-z0-9+.-]*:/i;

function parseUrl(s) { try { return new URL(s); } catch { return null; } }

/** The href to navigate to, or null when the link is not one we will
 * hand to the browser. */
function safeLink(raw) {
  if (typeof raw !== "string") return null;
  const s = raw.trim();
  if (!s) return null;
  // A bare host is a common thing to type and is not a URL; read it as
  // https. Anything carrying its own scheme is judged on that scheme.
  const u = parseUrl(s) ?? (HAS_SCHEME.test(s) ? null : parseUrl("https://" + s));
  return u && LINK_SCHEMES.has(u.protocol) ? u.href : null;
}

// ---------------------------------------------------------------- ui

function setStatus(s) {
  $("#status").textContent = storageFull ? s + " · cache full" : s;
}

function listNames(shown) {
  const counts = {};
  for (const item of Object.values(shown)) {
    counts[item.body.list] = (counts[item.body.list] ?? 0) + 1;
  }
  return counts;
}

function fmtDate(ts) { return new Date(ts).toLocaleString(); }

// The token itself never reaches the DOM; this is what the panel says
// instead of handing a password manager a secret to remember. A ticket's
// `name` is the label when there is one — it is a courtesy to the human
// and trusted for nothing — and the url otherwise.
function renderConfigState() {
  const el = $("#cfg-state");
  if (!config) { el.textContent = "not connected"; return; }
  const exp = tokenExp(config.token);
  const who = config.name ? config.name + " · " + config.url : config.url;
  el.textContent = "paired with " + who + " · token " +
    (exp === null ? "never expires" : "valid until " + new Date(exp * 1000).toLocaleString());
}

// What the screen is missing when an action was refused, said as the thing
// the user cannot do rather than as a permission string.
const NOT_ALLOWED = {
  create: "cannot add entries",
  update: "cannot change them",
  delete: "cannot delete them",
};

/** The sentence the banner carries, or "" when there is nothing to say. */
function permissionNote() {
  if (!config) return "";
  if (facetMissing) {
    return `Setup for “${FACET}” has not completed. Pending entries are saved on this ` +
      `device; the app will retry automatically.`;
  }
  if (!can("read")) {
    return "This app was not given permission to read your lists, so there is nothing to " +
      "show. Disconnect and pair again to ask for it.";
  }
  const missing = ["create", "update", "delete"].filter(a => !can(a));
  if (missing.length === 3) {
    return "Read-only: this app was approved to read your lists and nothing else. " +
      "Disconnect and pair again to ask for more.";
  }
  if (missing.length) {
    return "Approved for part of what was asked: " +
      missing.map(a => NOT_ALLOWED[a]).join(", ") +
      ". Disconnect and pair again to ask for more.";
  }
  return "";
}

/** The screen obeys what was granted rather than what was asked for: a
 * control for something the core will refuse comes off it, because an Add
 * button that always fails is worse than no Add button. */
function renderPermissions() {
  $("#add-card").hidden = !can("create");
  const note = permissionNote();
  const banner = $("#perm-banner");
  banner.textContent = note;
  banner.hidden = !note;
  banner.className = "card app" +
    (facetMissing || !can("read") ? " blocked" : note ? " readonly" : "");
}

function renderChips(shown) {
  const counts = listNames(shown);
  const names = Object.keys(counts).sort();
  const chip = (label, value, count) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (selected === value ? " active" : "");
    b.textContent = label;
    if (count !== undefined) {
      const n = document.createElement("span");
      n.className = "n"; n.textContent = count;
      b.append(n);
    }
    b.onclick = () => { selected = value; editing = null; persist(); render(); };
    return b;
  };
  const all = chip("all", null, Object.values(counts).reduce((a, b) => a + b, 0));
  $("#chips").replaceChildren(all, ...names.map(n => chip(n, n, counts[n])));
  // A vanished selection (last entry deleted) falls back to all.
  if (selected !== null && !(selected in counts)) { selected = null; persist(); }
  // The add form's list field follows the selected chip — but a render
  // fires every ten seconds, and typing is not something to overwrite.
  if (selected !== null && document.activeElement !== $("#f-list")) {
    $("#f-list").value = selected;
  }
}

function renderEditor(item) {
  const b = item.body;
  const ed = document.createElement("div");
  ed.className = "editor";

  const desc = document.createElement("input");
  desc.placeholder = "description"; desc.value = b.description ?? "";
  const link = document.createElement("input");
  link.placeholder = "link"; link.value = b.link ?? "";
  const list = document.createElement("input");
  list.placeholder = "list"; list.value = b.list;
  const attrs = document.createElement("textarea");
  attrs.placeholder = "attributes, one per line:  author: Susanna Clarke";
  attrs.value = attrsToText(b.attributes);
  // Without `update` the editor is still worth opening — it is where the
  // description, the link and the attributes are legible in full, and where
  // an entry says when it changed and who changed it. So it opens read-only
  // rather than not at all: the fields show, and nothing offers to save.
  const editable = can("update");
  for (const field of [list, desc, link, attrs]) field.readOnly = !editable;

  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = editable
    ? "key: value · numbers, true/false, and [arrays] are typed; anything else is a string"
    : "read-only: this app was not approved to change entries";

  const dates = document.createElement("div");
  dates.className = "dates";
  const by = item.source
    ? " by " + [item.source.user, item.source.client].filter(Boolean).join(" · ")
    : "";
  dates.textContent = `added ${fmtDate(item.created_at)} · modified ${fmtDate(item.updated_at)}${by}`;

  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.className = "primary"; saveBtn.textContent = "Save";
  saveBtn.onclick = () => {
    let parsed;
    try { parsed = textToAttrs(attrs.value); }
    catch (e) { setStatus(e.message); return; }
    const listName = list.value.trim();
    if (!listName) { setStatus("a list name is required"); return; }
    editing = null;
    // A patch, not a whole body: `name` is untouched here, so a rename
    // made elsewhere survives this save. Cleared fields go as null,
    // which the merge reads as "remove" — a strict schema has no room
    // for an empty string.
    mutate(item.id, {
      list: listName,
      description: desc.value.trim() || null,
      link: link.value.trim() || null,
      attributes: Object.keys(parsed).length ? parsed : null,
    });
  };
  const del = document.createElement("button");
  del.type = "button";
  del.className = "danger"; del.textContent = "Delete";
  del.onclick = () => removeEntry(item.id);
  const spacer = document.createElement("span");
  spacer.className = "spacer";
  const buttons = document.createElement("div");
  buttons.className = "buttons";
  buttons.append(...(editable ? [saveBtn] : []), ...(can("delete") ? [del] : []), spacer);

  ed.append(list, desc, link, attrs, hint, dates, buttons);
  return ed;
}

function render() {
  renderPermissions();
  const all = view();
  renderChips(all);
  const shown = Object.values(all)
    .filter(i => selected === null || i.body.list === selected)
    .sort((a, b) => a.body.name.localeCompare(b.body.name));
  $("#empty").style.display = shown.length ? "none" : "block";
  $("#entries").replaceChildren(...shown.map(item => {
    const b = item.body;
    const li = document.createElement("li");
    li.className = "entry" + (item.pending ? " pending" : "");

    const row = document.createElement("div");
    row.className = "row";
    const nm = document.createElement("span");
    nm.className = "nm";
    const href = safeLink(b.link);
    if (href) {
      const a = document.createElement("a");
      a.href = href; a.textContent = b.name;
      a.target = "_blank"; a.rel = "noreferrer noopener";
      a.onclick = e => e.stopPropagation();
      nm.append(a);
    } else {
      nm.textContent = b.name;
    }
    row.append(nm);
    if (b.link && !href) {
      // The link stays visible as text so it can be seen and fixed; it
      // is never an href.
      const bad = document.createElement("span");
      bad.className = "in blocked";
      bad.textContent = "link ignored";
      bad.title = String(b.link);
      row.append(bad);
    }
    if (b.description) {
      const d = document.createElement("span");
      d.className = "desc"; d.textContent = b.description;
      row.append(d);
    }
    if (selected === null) {
      const inList = document.createElement("span");
      inList.className = "in"; inList.textContent = b.list;
      row.append(inList);
    }
    row.onclick = () => { editing = editing === item.id ? null : item.id; render(); };
    li.append(row);

    if (editing === item.id) {
      li.append(renderEditor(item));
    } else if (b.attributes && Object.keys(b.attributes).length) {
      const bar = document.createElement("div");
      bar.className = "attrs";
      for (const [k, v] of Object.entries(b.attributes)) {
        const chip = document.createElement("span");
        chip.className = "attr";
        const key = document.createElement("b");
        key.textContent = k;
        chip.append(key, " " + (typeof v === "string" ? v : JSON.stringify(v)));
        bar.append(chip);
      }
      li.append(bar);
    }
    return li;
  }));
}

$("#addform").onsubmit = e => {
  e.preventDefault();
  const list = $("#f-list").value.trim();
  const name = $("#f-name").value.trim();
  if (!list || !name || !config || !can("create")) return;
  addEntry(list, name);
  $("#f-name").value = "";
};

$("#cfg-save").onclick = () => {
  // An empty token field with a config already saved means "keep the
  // token, change the url" — the field is empty by design, not by
  // accident, so it must not read as "erase my credentials".
  const token = $("#cfg-token").value.trim() || config?.token;
  const url = $("#cfg-url").value.trim().replace(/\/$/, "");
  if (!token || !url) { setStatus("url and token required"); return; }
  $("#cfg-token").value = "";
  cancelPairing();
  pairMsg("");
  // Hand-entered details name a core by its url; a label only ever comes
  // from a ticket, so there is none to keep here. What the token holds is
  // whatever it holds — connect asks the core rather than assuming.
  connect(url, token, null).catch(error => pairMsg(error.message, "bad"));
};

$("#cfg-pair").onclick = () => pairWith($("#cfg-ticket").value);

$("#pair-cancel").onclick = () => {
  cancelPairing();
  pairMsg("");
  setStatus(config ? "paired" : "not paired");
};

// A ticket is one line, so Enter pairs and Shift+Enter is the newline
// nobody typing a ticket wants by accident.
$("#cfg-ticket").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    pairWith($("#cfg-ticket").value);
  }
};

$("#scan-btn").onclick = () => startScan();
$("#scan-cancel").onclick = () => { stopScan(); pairMsg(""); };

$("#cfg-forget").onclick = () => disconnect();

// ---------------------------------------------------------------- boot

// A stored config is a working session and stays one. Its token is still
// valid, so it is adopted as it stands — the first sync asks the core what
// that token holds and the screen settles onto the answer.
if (config) $("#cfg-url").value = config.url;
renderPairState();
renderConfigState();
render();          // cache renders instantly, before any network
initScanning();    // and the pairing screen learns whether it has a camera
const pendingPair = load(PENDING_PAIR, null);
if (pendingPair?.proof && pendingPair?.code && pendingPair?.url) {
  pairing = { ...pendingPair, live: true };
  $("#settings").open = true;
  showWaiting(pairing.name ?? pairing.url, "resuming pairing…");
  pollPairing(pairing.name ?? pairing.url, pairing);
}
streamLoop();      // then the feed trues it up: catch-up poll, then live
// The stream is an optimization; the cursor poll is the source of
// correctness, so it keeps running — every beat while the stream is down,
// every minute while it holds.
let beats = 0;
setInterval(() => { if (!streamLive || ++beats % 6 === 0) sync(); }, 10_000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") sync();
  else stopScan();   // a backgrounded tab holding the camera open
});
window.addEventListener("pagehide", stopScan);
</script>
</body>
</html>
