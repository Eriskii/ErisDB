name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  crate:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    # The three Rust components are separate crate trees with no workspace
    # root, so each is built from its own directory.
    strategy:
      fail-fast: false
      matrix:
        crate: [erisdb, erisdb-client, erisdb-mcp]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ matrix.crate }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.crate }}-

      # Advisory. The tree is hand-formatted wider than rustfmt's default and
      # reads better for it, so a diff here is a note, not a verdict.
      - name: Format
        run: cargo fmt --check || true

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The suites bring up real Postgres through testcontainers, against the
      # Docker daemon the runner already has.
      - name: Test
        run: cargo test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/update-csp.py --check
      - run: cargo build --locked --manifest-path erisdb/Cargo.toml --bin erisdb
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - name: Build both apps with their actual JNI library
        run: ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865" scripts/build-android.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android UI and Iroh tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/android/run.sh
